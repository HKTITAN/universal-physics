<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 250" font-family="monospace" font-size="12"><text x="170" y="30" text-anchor="middle" fill="#26251f" font-weight="bold">half-plane picture</text><line x1="40" y1="180" x2="300" y2="180" stroke="#26251f" stroke-width="1.5"/><line x1="110" y1="180" x2="230" y2="180" stroke="#b07d2b" stroke-width="4"/><text x="170" y="200" text-anchor="middle" fill="#b07d2b">interval I</text><circle cx="110" cy="180" r="3.5" fill="#1d3f68"/><circle cx="230" cy="180" r="3.5" fill="#1d3f68"/><text x="105" y="168" text-anchor="middle" fill="#1d3f68" font-size="10">-R</text><text x="235" y="168" text-anchor="middle" fill="#1d3f68" font-size="10">+R</text><path d="M 170 160 A 45 45 0 0 1 170 70" fill="none" stroke="#2f5b8f" stroke-width="1" stroke-dasharray="4 3"/><text x="170" y="58" text-anchor="middle" fill="#2f5b8f" font-size="10.5">(Laplacian - m^2)U = 0 above</text><line x1="320" y1="130" x2="385" y2="130" stroke="#b07d2b" stroke-width="1.5"/><circle cx="385" cy="130" r="3" fill="#b07d2b"/><text x="352" y="118" text-anchor="middle" fill="#b07d2b" font-size="10.5">w = log((z-R)/(z+R))</text><text x="530" y="30" text-anchor="middle" fill="#26251f" font-weight="bold">strip picture</text><rect x="405" y="70" width="250" height="110" fill="#eef2f7" stroke="none"/><line x1="405" y1="70" x2="655" y2="70" stroke="#2f5b8f" stroke-width="2"/><line x1="405" y1="180" x2="655" y2="180" stroke="#2f5b8f" stroke-width="2"/><text x="530" y="62" text-anchor="middle" fill="#2f5b8f" font-size="10.5">eta = pi:  dU = 0,  V = cU</text><text x="530" y="196" text-anchor="middle" fill="#2f5b8f" font-size="10.5">eta = 0:  dV = 0,  U = V</text><text x="530" y="130" text-anchor="middle" fill="#26251f" font-size="10.5">Q = m^2 R^2 (cosh xi - cos eta)^(-2)</text><text x="530" y="148" text-anchor="middle" fill="#8a887e" font-size="10">decays exp(-2|xi|) at both ends; corners at xi = -/+ infinity</text><text x="350" y="235" text-anchor="middle" fill="#8a887e" font-size="10.5">the corners of the interval become the ends of the strip; the mass term is the only symmetry-breaking piece</text></svg>