<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 370" font-family="monospace" font-size="12"><rect x="30" y="120" width="150" height="110" fill="#eef2f7" stroke="#2f5b8f" stroke-width="1.5"/><text x="105.0" y="169.0" text-anchor="middle" fill="#26251f" font-weight="bold">MODULAR DATA</text><text x="105.0" y="187.0" text-anchor="middle" fill="#8a887e" font-size="10.5">algebra, state; Tomita data</text><line x1="180" y1="175" x2="230" y2="62" stroke="#2f5b8f" stroke-width="1"/><text x="240" y="58" fill="#26251f">1. stress-tensor flux</text><line x1="240" y1="68" x2="490" y2="68" stroke="#2f5b8f" stroke-width="1.5"/><circle cx="490" cy="68" r="3" fill="#2f5b8f"/><line x1="180" y1="175" x2="230" y2="120" stroke="#2f5b8f" stroke-width="1"/><text x="240" y="116" fill="#26251f">2. modular Berry</text><line x1="240" y1="126" x2="490" y2="126" stroke="#2f5b8f" stroke-width="1.5"/><circle cx="490" cy="126" r="3" fill="#2f5b8f"/><line x1="180" y1="175" x2="230" y2="178" stroke="#2f5b8f" stroke-width="1"/><text x="240" y="174" fill="#26251f">3. Lorentzian NCG</text><line x1="240" y1="184" x2="490" y2="184" stroke="#2f5b8f" stroke-width="1.5"/><circle cx="490" cy="184" r="3" fill="#2f5b8f"/><line x1="180" y1="175" x2="230" y2="236" stroke="#2f5b8f" stroke-width="1"/><text x="240" y="232" fill="#26251f">4. causal fermions</text><line x1="240" y1="242" x2="490" y2="242" stroke="#2f5b8f" stroke-width="1.5"/><circle cx="490" cy="242" r="3" fill="#2f5b8f"/><line x1="180" y1="175" x2="230" y2="294" stroke="#2f5b8f" stroke-width="1"/><text x="240" y="290" fill="#26251f">5. net naturality</text><line x1="240" y1="300" x2="490" y2="300" stroke="#2f5b8f" stroke-width="1.5"/><circle cx="490" cy="300" r="3" fill="#2f5b8f"/><line x1="500" y1="35" x2="500" y2="345" stroke="#b07d2b" stroke-width="4"/><text x="516" y="120" fill="#b07d2b" font-weight="bold">THE CARRIER PROBLEM</text><text x="516" y="140" fill="#8a887e" font-size="10.5">derive a localized, algebra-compatible</text><text x