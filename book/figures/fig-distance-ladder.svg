<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" font-family="monospace" font-size="12"><line x1="120" y1="320" x2="580" y2="320" stroke="#2f5b8f" stroke-width="3"/><text x="130" y="312" fill="#26251f" font-size="11">1. the free-field gate: two named lemmas, attackable now</text><line x1="120" y1="276" x2="580" y2="276" stroke="#2f5b8f" stroke-width="3"/><text x="130" y="268" fill="#26251f" font-size="11">2. R7 to R8: fires automatically on rung 1</text><line x1="120" y1="232" x2="580" y2="232" stroke="#b07d2b" stroke-width="3"/><text x="130" y="224" fill="#26251f" font-size="11">3. interacting nets: no known technology</text><line x1="120" y1="188" x2="580" y2="188" stroke="#b07d2b" stroke-width="3"/><text x="130" y="180" fill="#26251f" font-size="11">4. the causal order n1: presupposed by every known seed</text><line x1="120" y1="144" x2="580" y2="144" stroke="#b07d2b" stroke-width="3"/><text x="130" y="136" fill="#26251f" font-size="11">5. the carrier: five routes halt; 22 confirmations say the wall is real</text><line x1="120" y1="100" x2="580" y2="100" stroke="#b07d2b" stroke-width="3"/><text x="130" y="92" fill="#26251f" font-size="11">6. a distinguishing experiment: none exists even in principle</text><line x1="120" y1="56" x2="580" y2="56" stroke="#8a887e" stroke-width="3"/><text x="130" y="48" fill="#26251f" font-size="11">7. a universal theory: beyond every current program</text><line x1="120" y1="40" x2="120" y2="330" stroke="#26251f" stroke-width="1.5"/><line x1="580" y1="40" x2="580" y2="330" stroke="#26251f" stroke-width="1.5"/></svg>